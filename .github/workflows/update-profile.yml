name: Refresh profile cards

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test data calculations
        run: node --test scripts/update-profile.test.mjs
      - name: Fetch GitHub data and render custom SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Technicalranjitofficial
        run: node scripts/update-profile.mjs
      - name: Publish refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated data/github-summary.json README.md
          if git diff --cached --quiet; then
            echo 'Cards are already up to date.'
            exit 0
          fi
          git commit -m 'Refresh GitHub profile data [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
